<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thai-Arabic Numeral & BahtText Converter</title>

    <!-- Google Fonts: Google Sans -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
    
    <!-- Emoji Favicon (Thai Number Nine: ๙) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>๙</text></svg>">    
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL,GRAD,opsz,wght@0,0,20,400&amp;icon_names=currency_exchange,dark_mode,light_mode,content_copy,content_paste,check,backspace,universal_currency_alt,pin,arrow_right_alt&amp;display=block" rel="stylesheet">    
<link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header & Theme Toggle -->
    <header>
        <h1>Thai Numeral & Currency Converter</h1>
        <button id="themeToggle" type="button" onclick="toggleDarkMode()" class="theme-btn" aria-label="Switch to dark theme" title="Switch to dark theme">
            <span id="themeIcon" class="material-symbols-outlined theme-icon" aria-hidden="true">dark_mode</span>
        </button>
    </header>

    <!-- Main Container -->
    <main>
        <!-- Tab Navigation Bar -->
        <nav class="tab-container">
            <button class="tab-btn active" onclick="switchTab('bahtTab', this)">BahtText</button>
            <button class="tab-btn" onclick="switchTab('thaiToArabicTab', this)">๑๒๓ → 123</button>
            <button class="tab-btn" onclick="switchTab('arabicToThaiTab', this)">123 → ๑๒๓</button>
            <button class="tab-btn" onclick="switchTab('numberFormatTab', this)">Number Format</button>
        </nav>

        <!-- Tab 1: BahtText -->
        <div id="bahtTab" class="tab-content active">
            <div class="card">
                <label for="bahtInput">Thai Baht Amount</label>
                <input type="text" id="bahtInput" inputmode="decimal" placeholder="e.g., 1250.75 or ๒๕๖๐.๕๐" oninput="convertBahtText()">

                <div style="margin-top: 1rem;">
                    <span class="result-label">Thai Baht Text:</span>
                    <div class="result-row">
                        <div id="bahtResult" class="result-value" lang="th">หนึ่งพันสองร้อยห้าสิบบาทเจ็ดสิบห้าสตางค์</div>
                        <button onclick="copyToClipboard('bahtResult', this)" class="action-btn"><span class="material-symbols-outlined tool-icon" aria-hidden="true">content_copy</span> Copy</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tab 2: Thai to Arabic -->
        <div id="thaiToArabicTab" class="tab-content">
            <div class="card">
                <div class="chip-display-header">
                    <label for="thaiInput" style="margin-bottom: 0;">Thai Numerals & Text</label>
                    <div class="chip-actions-group">
                        <button onclick="pasteFromClipboard()" class="action-btn"><span class="material-symbols-outlined tool-icon" aria-hidden="true">content_paste</span> Paste</button>
                        <button onclick="backspaceThai()" class="action-btn"><span class="material-symbols-outlined tool-icon" aria-hidden="true">backspace</span> Delete</button>
                        <button onclick="clearChips()" class="clear-btn">Clear</button>
                    </div>
                </div>

                <textarea id="thaiInput" rows="3" placeholder="Tap keys or paste text…"
                    oninput="updateThaiChipDisplay()" spellcheck="false"></textarea>
                <p id="pasteStatus" class="status-text" role="status"></p>

                <!-- Thai Numpad & Symbol Chips Palette -->
                <div class="palette-grid">
                    <button onclick="appendThai('๑')" class="chip-btn">๑ <span class="chip-sub">1</span></button>
                    <button onclick="appendThai('๒')" class="chip-btn">๒ <span class="chip-sub">2</span></button>
                    <button onclick="appendThai('๓')" class="chip-btn">๓ <span class="chip-sub">3</span></button>
                    <button onclick="appendThai('๔')" class="chip-btn">๔ <span class="chip-sub">4</span></button>
                    <button onclick="appendThai('๕')" class="chip-btn">๕ <span class="chip-sub">5</span></button>

                    <button onclick="appendThai('๖')" class="chip-btn">๖ <span class="chip-sub">6</span></button>
                    <button onclick="appendThai('๗')" class="chip-btn">๗ <span class="chip-sub">7</span></button>
                    <button onclick="appendThai('๘')" class="chip-btn">๘ <span class="chip-sub">8</span></button>
                    <button onclick="appendThai('๙')" class="chip-btn">๙ <span class="chip-sub">9</span></button>
                    <button onclick="appendThai('๐')" class="chip-btn">๐ <span class="chip-sub">0</span></button>

                    <button onclick="appendThai('.')" class="chip-btn symbol-btn">.</button>
                    <button onclick="appendThai(',')" class="chip-btn symbol-btn">,</button>
                    <button onclick="appendThai('(')" class="chip-btn symbol-btn">(</button>
                    <button onclick="appendThai(')')" class="chip-btn symbol-btn">)</button>
                    <button onclick="appendThai('%')" class="chip-btn symbol-btn">%</button>

                    <button onclick="appendThai('+')" class="chip-btn symbol-btn">+</button>
                    <button onclick="appendThai('-')" class="chip-btn symbol-btn">-</button>
                    <button onclick="appendThai('*')" class="chip-btn symbol-btn">*</button>
                    <button onclick="appendThai('/')" class="chip-btn symbol-btn">/</button>
                    <button onclick="appendThai('=')" class="chip-btn symbol-btn">=</button>
                </div>

                <div class="thai-conversion-result" style="margin-top: 1rem;">
                    <span class="result-label">Arabic Numerals:</span>
                    <div class="result-row">
                        <div id="arabicResult" class="result-value">0</div>
                        <button onclick="copyToClipboard('arabicResult', this)" class="action-btn"><span class="material-symbols-outlined tool-icon" aria-hidden="true">content_copy</span> Copy</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tab 3: Arabic to Thai -->
        <div id="arabicToThaiTab" class="tab-content">
            <div class="card">
                <label for="arabicInput">Arabic Expression Input</label>
                <input type="text" id="arabicInput" placeholder="e.g., (1,250.50 + 50%) * 2 = ?" oninput="convertArabicToThai()">

                <div style="margin-top: 1rem;">
                    <span class="result-label">Thai Numeral Result:</span>
                    <div class="result-row">
                        <div id="thaiResult" class="result-value">๒๕๖๙</div>
                        <button onclick="copyToClipboard('thaiResult', this)" class="action-btn"><span class="material-symbols-outlined tool-icon" aria-hidden="true">content_copy</span> Copy</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- Tab 4: Number formatting -->
        <div id="numberFormatTab" class="tab-content">
            <div class="format-tools">
                <section class="card" aria-labelledby="separatorHeading">
                    <h2 id="separatorHeading" class="tool-heading"><span class="material-symbols-outlined tool-icon" aria-hidden="true">pin</span>Separators</h2>
                    <label for="separatorInput">Number · Thai or Arabic digits</label>
                    <input type="text" id="separatorInput" inputmode="decimal" placeholder="1234567.50 or ๑๒๓๔๕๖๗.๕๐"
                        oninput="updateSeparators()">
                    <div class="separator-controls">
                        <label class="comma-toggle" for="separatorCommas">
                            <input type="checkbox" id="separatorCommas" role="switch" checked onchange="updateSeparators()">
                            <span class="toggle-track" aria-hidden="true"><span class="toggle-knob"></span></span>
                            <span class="toggle-label">Use commas<span id="separatorModeLabel" class="toggle-detail" aria-hidden="true">1,234.50</span></span>
                        </label>
                        <button class="clear-btn" onclick="clearFormatInput('separator')">Clear</button>
                    </div>
                    <div class="result-row">
                        <output id="separatorResult" class="result-value" for="separatorInput separatorCommas">---</output>
                        <button id="separatorCopy" onclick="copyToClipboard('separatorResult', this)" class="action-btn" disabled><span class="material-symbols-outlined tool-icon" aria-hidden="true">content_copy</span>Copy</button>
                    </div>
                    <p id="separatorStatus" class="format-status" role="status"></p>
                </section>

                <section class="card" aria-labelledby="currencyHeading">
                    <h2 id="currencyHeading" class="tool-heading"><span class="material-symbols-outlined tool-icon" aria-hidden="true">universal_currency_alt</span>Currency Notation</h2>
                    <label for="currencyInput">Amount · with or without a currency</label>
                    <input type="text" id="currencyInput" placeholder="US$1,234.50"
                        oninput="updateCurrencyFormat()">
                    <div class="format-controls">
                        <div>
                            <label for="currencySelect">Currency</label>
                            <select id="currencySelect" onchange="updateCurrencyRegions(); updateCurrencyFormat()">
                                <option value="">Detect currency</option>
                            </select>
                        </div>
                        <div>
                            <label for="currencyInputFormat">Input separators</label>
                            <select id="currencyInputFormat" onchange="updateCurrencyFormat()">
                                <option value="english">1,234.50</option>
                                <option value="commaDecimal">1.234,50</option>
                                <option value="regional">Currency region</option>
                            </select>
                        </div>
                        <div>
                            <label for="currencyStyle">Output style</label>
                            <select id="currencyStyle" onchange="updateCurrencyFormat()">
                                <option value="thai">Thai name</option>
                                <option value="code">Code</option>
                                <option value="symbol">Symbol (English)</option>
                                <option value="regional">Regional</option>
                            </select>
                        </div>
                        <div>
                            <label for="currencyDigits">Output digits</label>
                            <select id="currencyDigits" onchange="updateCurrencyFormat()">
                                <option value="preserve">Keep input</option>
                                <option value="arabic">Arabic (123)</option>
                                <option value="thai">Thai (๑๒๓)</option>
                            </select>
                        </div>
                        <div id="currencyRegionControl" hidden>
                            <label for="currencyRegion">Region</label>
                            <select id="currencyRegion" onchange="updateCurrencyFormat()"></select>
                        </div>
                        <div>
                            <label for="currencyPrecision">Decimal places</label>
                            <select id="currencyPrecision" onchange="updateCurrencyFormat()">
                                <option value="preserve">Preserve input</option>
                                <option value="currency">Currency default</option>
                                <option value="custom">Custom</option>
                            </select>
                        </div>
                        <div id="customDecimalsControl" hidden>
                            <label for="currencyDecimals">Number of decimal places</label>
                            <select id="currencyDecimals" onchange="updateCurrencyFormat()">
                                <option value="0">0</option>
                                <option value="1">1</option>
                                <option value="2" selected>2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5">5</option>
                                <option value="6">6</option>
                            </select>
                        </div>
                    </div>
                    <div class="result-row">
                        <output id="currencyResult" class="result-value" for="currencyInput currencySelect currencyStyle">---</output>
                        <button id="currencyCopy" onclick="copyToClipboard('currencyResult', this)" class="action-btn" disabled><span class="material-symbols-outlined tool-icon" aria-hidden="true">content_copy</span> Copy</button>
                    </div>
                    <p id="currencyStatus" class="format-status" role="status"></p>
                    <p id="currencyRounding" class="format-status rounding-notice" role="status"></p>
                    <div class="tool-footer">
                        <span id="currencyDetected" class="format-status"></span>
                        <button class="clear-btn" onclick="clearFormatInput('currency')">Clear</button>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer><span id="clipboardStatus" role="status"></span></footer>

    <script src="converter.js"></script>
    <script src="currencies.js"></script>
    <script src="number-format.js"></script>
    <script src="app.js"></script>
    <script src="custom-select.js"></script>
    <script src="format-ui.js"></script>
</body>
</html>
