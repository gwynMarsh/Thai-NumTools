<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thai-Arabic Numeral & BahtText Converter</title>

    <!-- Google Fonts: Google Sans -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
    
    <!-- Emoji Favicon (Thai Number Nine: ๙) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>๙</text></svg>">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header & Theme Toggle -->
    <header>
        <h1>🇹🇭 Thai Numeral & Currency Converter</h1>
        <button onclick="toggleDarkMode()" class="theme-btn" aria-label="Toggle light or dark theme">
            <span id="themeIcon">🌙</span>
        </button>
    </header>

    <!-- Main Container -->
    <main>
        <!-- Tab Navigation Bar -->
        <nav class="tab-container">
            <button class="tab-btn active" onclick="switchTab('bahtTab', this)">BahtText</button>
            <button class="tab-btn" onclick="switchTab('thaiToArabicTab', this)">๑๒๓ → 123</button>
            <button class="tab-btn" onclick="switchTab('arabicToThaiTab', this)">123 → ๑๒๓</button>
        </nav>

        <!-- Tab 1: BahtText -->
        <div id="bahtTab" class="tab-content active">
            <div class="card">
                <label for="bahtInput">Thai Baht Amount</label>
                <input type="text" id="bahtInput" inputmode="decimal" placeholder="e.g., 1250.75 or ๒๕๖๐.๕๐" oninput="convertBahtText()">

                <div style="margin-top: 1rem;">
                    <span class="result-label">Thai Baht Text:</span>
                    <div class="result-row">
                        <div id="bahtResult" class="result-value" lang="th">หนึ่งพันสองร้อยห้าสิบบาทเจ็ดสิบห้าสตางค์</div>
                        <button onclick="copyToClipboard('bahtResult', this)" class="action-btn">📋 Copy</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tab 2: Thai to Arabic -->
        <div id="thaiToArabicTab" class="tab-content">
            <div class="card">
                <div class="chip-display-header">
                    <label for="thaiInput" style="margin-bottom: 0;">Thai Numerals & Text</label>
                    <div class="chip-actions-group">
                        <button onclick="pasteFromClipboard()" class="action-btn">📋 Paste</button>
                        <button onclick="backspaceThai()" class="action-btn">❌ Delete</button>
                        <button onclick="clearChips()" class="clear-btn">Clear</button>
                    </div>
                </div>

                <textarea id="thaiInput" rows="3" placeholder="Tap keys or paste text…"
                    oninput="updateThaiChipDisplay()" spellcheck="false"></textarea>
                <p id="pasteStatus" class="status-text" role="status"></p>

                <!-- Thai Numpad & Symbol Chips Palette -->
                <div class="palette-grid">
                    <button onclick="appendThai('๑')" class="chip-btn">๑ <span class="chip-sub">1</span></button>
                    <button onclick="appendThai('๒')" class="chip-btn">๒ <span class="chip-sub">2</span></button>
                    <button onclick="appendThai('๓')" class="chip-btn">๓ <span class="chip-sub">3</span></button>
                    <button onclick="appendThai('๔')" class="chip-btn">๔ <span class="chip-sub">4</span></button>
                    <button onclick="appendThai('๕')" class="chip-btn">๕ <span class="chip-sub">5</span></button>

                    <button onclick="appendThai('๖')" class="chip-btn">๖ <span class="chip-sub">6</span></button>
                    <button onclick="appendThai('๗')" class="chip-btn">๗ <span class="chip-sub">7</span></button>
                    <button onclick="appendThai('๘')" class="chip-btn">๘ <span class="chip-sub">8</span></button>
                    <button onclick="appendThai('๙')" class="chip-btn">๙ <span class="chip-sub">9</span></button>
                    <button onclick="appendThai('๐')" class="chip-btn">๐ <span class="chip-sub">0</span></button>

                    <button onclick="appendThai('.')" class="chip-btn symbol-btn">.</button>
                    <button onclick="appendThai(',')" class="chip-btn symbol-btn">,</button>
                    <button onclick="appendThai('(')" class="chip-btn symbol-btn">(</button>
                    <button onclick="appendThai(')')" class="chip-btn symbol-btn">)</button>
                    <button onclick="appendThai('%')" class="chip-btn symbol-btn">%</button>

                    <button onclick="appendThai('+')" class="chip-btn symbol-btn">+</button>
                    <button onclick="appendThai('-')" class="chip-btn symbol-btn">-</button>
                    <button onclick="appendThai('*')" class="chip-btn symbol-btn">*</button>
                    <button onclick="appendThai('/')" class="chip-btn symbol-btn">/</button>
                    <button onclick="appendThai('=')" class="chip-btn symbol-btn">=</button>
                </div>

                <div style="margin-top: 1rem;">
                    <span class="result-label">Arabic Numerals:</span>
                    <div class="result-row">
                        <div id="arabicResult" class="result-value">0</div>
                        <button onclick="copyToClipboard('arabicResult', this)" class="action-btn">📋 Copy</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tab 3: Arabic to Thai -->
        <div id="arabicToThaiTab" class="tab-content">
            <div class="card">
                <label for="arabicInput">Arabic Expression Input</label>
                <input type="text" id="arabicInput" placeholder="e.g., (1,250.50 + 50%) * 2 = ?" oninput="convertArabicToThai()">

                <div style="margin-top: 1rem;">
                    <span class="result-label">Thai Numeral Result:</span>
                    <div class="result-row">
                        <div id="thaiResult" class="result-value">๒๕๖๙</div>
                        <button onclick="copyToClipboard('thaiResult', this)" class="action-btn">📋 Copy</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer><span id="clipboardStatus" role="status"></span></footer>

    <script src="converter.js"></script>
    <script src="app.js"></script>
</body>
</html>
